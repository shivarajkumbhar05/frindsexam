<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | ExamHub</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body"><div class="auth-container">
<div class="auth-brand"><a href="index.html" class="logo">Exam<span>Hub</span></a><p>Create your examination account</p></div>
<div class="auth-card"><h1>Create Account</h1><p class="auth-subtitle">Register to start your online examination.</p>
<form id="registerForm"><div class="form-group"><label>Full Name</label><input type="text" id="registerName" placeholder="Enter your full name" required></div>
<div class="form-group"><label>Email Address</label><input type="email" id="registerEmail" placeholder="you@example.com" required></div>
<div class="form-group"><label>Password</label><input type="password" id="registerPassword" placeholder="Create a password" minlength="6" required></div>
<div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" placeholder="Confirm your password" required></div>
<label class="terms"><input type="checkbox" required> I agree to the terms and conditions.</label>
<button type="submit" class="btn btn-primary full-width">Create Account →</button><p id="registerMessage" class="message"></p></form>
<p class="auth-bottom">Already have an account? <a href="login.html">Login</a></p></div></div>
<script src="script.js"></script></body></html>
