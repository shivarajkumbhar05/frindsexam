<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Exam | ExamHub</title><link rel="stylesheet" href="style.css"></head>
<body class="exam-body">
<header class="exam-header"><div class="logo">Exam<span>Hub</span></div><div class="exam-info"><span>Computer Science Exam</span><div class="timer">⏱ <span id="timer">10:00</span></div></div></header>
<main class="exam-layout"><section class="exam-main">
<div class="question-header"><span id="questionNumber">Question 1 of 10</span><span id="answeredCount">0 / 10 Answered</span></div>
<div class="progress-bar"><div id="progress"></div></div>
<div class="question-card"><p class="question-category">COMPUTER SCIENCE</p><h2 id="questionText">What does HTML stand for?</h2><div id="options" class="options"></div></div>
<div class="exam-navigation"><button id="previousBtn" class="btn btn-light">← Previous</button><button id="nextBtn" class="btn btn-primary">Next →</button></div>
</section>
<aside class="question-sidebar"><h3>Questions</h3><div id="questionNumbers" class="question-numbers"></div>
<div class="legend"><div><span class="legend-current"></span> Current</div><div><span class="legend-answered"></span> Answered</div><div><span class="legend-empty"></span> Not Answered</div></div>
<button id="submitExam" class="btn btn-primary full-width">Submit Exam</button></aside></main>
<script src="script.js"></script></body></html>
