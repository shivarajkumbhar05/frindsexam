<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | ExamHub</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-body"><div class="auth-container">
<div class="auth-brand"><a href="index.html" class="logo">Exam<span>Hub</span></a><p>Online Examination Platform</p></div>
<div class="auth-card"><h1>Welcome Back 👋</h1><p class="auth-subtitle">Login to continue your examination.</p>
<form id="loginForm"><div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="you@example.com" required></div>
<div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required></div>
<div class="form-options"><label class="remember"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
<button type="submit" class="btn btn-primary full-width">Login →</button><p id="loginMessage" class="message"></p></form>
<div class="divider"><span>OR</span></div><p class="auth-bottom">Don't have an account? <a href="register.html">Create Account</a></p></div></div>
<script src="script.js"></script></body></html>
